buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'maven-publish'

version = '1.0.0'
group = 'kriturkreature'
archivesBaseName = 'kriturkreature'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
        data {
            workingDirectory project.file('run')
        }
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://maven.minecraftforge.net' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    // GeckoLib for Forge 1.20.1 - from mavenLocal with fixed POM
    implementation 'software.bernie.geckolib:geckolib-forge-1.20.1:4.8.4'

    // For data generation
    implementation 'net.minecraftforge:forge:1.20.1-47.3.0:sources'
    
    // Force mapped forge version - use strict version
    implementation 'net.minecraftforge:forge:1.20.1-47.3.0_mapped_official_1.20.1@jar'
}

configurations.all {
    resolutionStrategy {
        force 'net.minecraftforge:forge:1.20.1-47.3.0_mapped_official_1.20.1'
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'kriturkreature',
            'Specification-Version': '1.0.0',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 17
}